<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 580" width="100%" height="100%">
  <rect x="6" y="6" width="328" height="568" rx="28" fill="#ffffff" stroke="#1e293b" stroke-width="5"/>
  
  <!-- Header -->
  <text x="24" y="42" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="bold">&#8592; TATASTEEL</text>
  <text x="250" y="42" fill="#0f172a" font-family="sans-serif" font-size="15" font-weight="bold">₹150.00</text>
  <text x="24" y="60" fill="#64748b" font-family="sans-serif" font-size="11">NSE: ₹150.00  •  BSE: ₹149.95</text>
  <line x1="16" y1="70" x2="324" y2="70" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Beginner Hint Pill -->
  <rect x="20" y="80" width="300" height="28" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="28" y="98" fill="#1d4ed8" font-family="sans-serif" font-size="11" font-weight="bold">Beginner Hint (4/25)</text>
  <text x="235" y="98" fill="#1e40af" font-family="sans-serif" font-size="11" text-decoration="underline">Turn off hints</text>

  <!-- Qty & Price -->
  <rect x="20" y="120" width="142" height="48" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="30" y="136" fill="#64748b" font-family="sans-serif" font-size="10">Quantity</text>
  <text x="30" y="156" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold">2</text>

  <rect x="178" y="120" width="142" height="48" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="188" y="136" fill="#64748b" font-family="sans-serif" font-size="10">Price</text>
  <text x="188" y="156" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold">150.00</text>

  <!-- Product Section -->
  <text x="20" y="192" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="bold">PRODUCT</text>
  <text x="295" y="192" fill="#387ed1" font-family="sans-serif" font-size="11" font-weight="bold">(?)</text>

  <circle cx="30" cy="212" r="6" fill="#387ed1"/>
  <text x="42" y="216" fill="#387ed1" font-family="sans-serif" font-size="13" font-weight="bold">Intraday (MIS)</text>

  <circle cx="176" cy="212" r="6" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <text x="188" y="216" fill="#475569" font-family="sans-serif" font-size="13">Longterm (CNC)</text>

  <!-- Dynamic Micro-Banner -->
  <rect x="20" y="228" width="300" height="62" rx="6" fill="#fefce8" stroke="#fde047"/>
  <rect x="20" y="228" width="5" height="62" rx="2" fill="#eab308"/>
  <text x="34" y="247" fill="#713f12" font-family="sans-serif" font-size="11" font-weight="bold">Intraday (MIS): Uses 5x borrowed margin.</text>
  <text x="34" y="264" fill="#713f12" font-family="sans-serif" font-size="11">MUST sell before 3:20 PM today or system</text>
  <text x="34" y="280" fill="#713f12" font-family="sans-serif" font-size="11">auto-sells with a ₹50 + GST penalty.</text>

  <!-- Order Type Section -->
  <text x="20" y="316" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="bold">ORDER TYPE</text>
  <text x="295" y="316" fill="#387ed1" font-family="sans-serif" font-size="11" font-weight="bold">(?)</text>

  <text x="24" y="340" fill="#64748b" font-family="sans-serif" font-size="12">○ Market</text>
  <text x="102" y="340" fill="#387ed1" font-family="sans-serif" font-size="12" font-weight="bold">● Limit</text>
  <text x="172" y="340" fill="#64748b" font-family="sans-serif" font-size="12">○ SL</text>
  <text x="225" y="340" fill="#64748b" font-family="sans-serif" font-size="12">○ SL-M</text>

  <rect x="20" y="352" width="300" height="32" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="30" y="372" fill="#475569" font-family="sans-serif" font-size="11">"Buys at ₹150.00 or lower. Safer than Market."</text>

  <!-- Bottom Margin & Swipe -->
  <rect x="20" y="438" width="300" height="54" rx="8" fill="#f1f5f9"/>
  <text x="30" y="458" fill="#0f172a" font-family="sans-serif" font-size="11.5" font-weight="bold">Margin req: ₹60.00</text>
  <text x="142" y="458" fill="#dc2626" font-family="sans-serif" font-size="11" font-weight="bold">(5x Risk: ₹300 value)</text>
  <text x="30" y="478" fill="#475569" font-family="sans-serif" font-size="11">Est. Round-trip Charges: ₹1.20 (Tap for breakup)</text>

  <rect x="20" y="506" width="300" height="46" rx="23" fill="#387ed1"/>
  <text x="92" y="534" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">&gt;&gt;&gt; SWIPE TO BUY &gt;&gt;&gt;</text>
</svg>
